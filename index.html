<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kenway Demo</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f0f4ff, #e8fff5);
        color: #1f2937;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .card {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 40px 50px;
        text-align: center;
        max-width: 480px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2.3rem;
      }

      p {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello, Kenway!</h1>
      <p>这是一个简单的网页示例，已经成功创建并准备提交到 GitHub。</p>
    </div>
  </body>
</html>
